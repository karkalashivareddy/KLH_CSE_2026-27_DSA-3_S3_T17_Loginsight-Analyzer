services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: loginsight-backend:local
    init: true
    environment:
      SERVER_PORT: "8080"
      LOGINSIGHT_SAMPLE_DATA_DIR: /app/sample-data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - loginsight

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: loginsight-frontend:local
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - loginsight

networks:
  loginsight:
    driver: bridge
