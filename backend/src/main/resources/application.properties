spring.application.name=loginsight-analyzer
server.port=8080

# Directory containing the bundled sample datasets (relative to backend/ at runtime)
loginsight.sample-data.dir=../sample-data

# UTF-8 everywhere; important for log text handling
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# Dev-friendly error JSON (global exception handler arrives in Phase 10)
server.error.include-message=never
server.error.include-stacktrace=never